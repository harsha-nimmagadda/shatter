    <style>
      /* Boot splash: painted before any JS or the main stylesheet, faded out by the game after its first frame. */
      html, body { margin: 0; height: 100%; background: #05010f; }
      #boot {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(120% 70% at 50% 38%, #2a0848 0%, #12043a 42%, #05010f 100%);
        transition: opacity 0.35s ease-out;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .logo {
        display: flex; margin: 0; font: italic 900 clamp(54px, 17vw, 104px) / 1 "Arial Black", "Segoe UI Black", "Roboto", "Helvetica Neue", system-ui, sans-serif;
        letter-spacing: -0.02em;
        filter: drop-shadow(0 0 10px rgba(255, 61, 203, 0.9)) drop-shadow(0 0 26px rgba(0, 229, 255, 0.55));
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .logo span {
        background: linear-gradient(180deg, #fff 0%, #bff6ff 38%, #00e5ff 50%, #ff3dcb 85%, #9d6bff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.55);
      }
      #boot .bar { position: relative; width: min(46vw, 220px); height: 3px; border-radius: 3px; background: rgba(157, 107, 255, 0.25); overflow: hidden; }
      #boot .bar i {
        position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #ff3dcb, #00e5ff); box-shadow: 0 0 10px #00e5ff;
        animation: boot-bar 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes boot-pulse { 50% { filter: drop-shadow(0 0 16px rgba(255, 61, 203, 1)) drop-shadow(0 0 38px rgba(0, 229, 255, 0.8)); } }
      @keyframes boot-bar { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .logo, #boot .bar i { animation: none; transition: none; }
        #boot .bar i { left: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Shatter">
      <h1 class="logo" aria-hidden="true"><span>S</span><span>H</span><span>A</span><span>T</span><span>T</span><span>E</span><span>R</span></h1>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
